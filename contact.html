<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Student Resource Hub</h1>

        <button id="menu-toggle" aria-label="Open navigation">
            ☰
        </button>

        <nav id="navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="page-content">
            <h2>Contact Us</h2>

            <p>
                Have a question or suggestion? Send us a message using
                the form below.
            </p>

            <form id="contact-form">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message here"
                    required
                ></textarea>

                <button type="submit">Send Message</button>
            </form>

            <p id="form-response" aria-live="polite"></p>
        </section>
    </main>

    <footer>
        <p> 2026 Student Resource Hub</p>
    </footer>

    <script src="app/app.js" defer></script>
    <script>
        document.getElementById("contact-form").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("form-response").textContent =
                "Thank you! Your form was submitted for this demo.";

            this.reset();
        });
    </script>
</body>
</html>
